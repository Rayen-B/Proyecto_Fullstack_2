<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador - Nuevo Producto</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="cuerpo-admin">

    <div class="contenedor-admin">

        
        <div class="barra-lateral">
            <div class="logo-barra-lateral">
                <h2>Company</h2>
            </div>

            
            <ul class="lista-menu">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="ordenes.html">Ordenes</a></li>
                <li><a href="productos.html">Inventario</a></li>
                <li><a href="#reportes">Reportes</a></li>
                <li><a href="usuarios.html">Empleados</a></li>
                <li><a href="#clientes">Clientes</a></li>
            </ul>

            
            <ul class="lista-menu menu-secundario">
                <li><a href="#ajustes">Configuracion</a></li>
                <li><a href="#perfil">Perfil</a></li>
                <li><a href="#buscar">Buscar</a></li>
                <li><a href="#ayuda">Ayuda</a></li>
            </ul>

            
            <div class="footer-barra-lateral">
                <p><b>Administrador</b></p>
                <a href="../index.html">Ir a Tienda</a>
                <a href="../login.html">Cerrar Sesión</a>
            </div>
        </div>

        
        <div class="panel-principal">
            
            
            <div class="encabezado-superior">
                <div>
                    <h1>NUEVO PRODUCTO</h1>
                    <p class="subtitulo-encabezado">Formulario de registro y edición de producto</p>
                </div>
                <div class="iconos-encabezado">
                    <span class="icono-notificacion">poner icono</span>
                </div>
            </div>

            <!-- FORMULARIO -->
            <div class="area-contenido">
                
                <div class="caja-formulario">
                    
                    <div class="barra-titulo-formulario">
                        <h3>Registro de producto</h3>
                    </div>

                    <form class="formulario-admin" action="#" method="POST">

                        
                        <div class="grupo-campo">
                            <label for="codigo">Código Producto</label>
                            <input type="text" id="codigo" name="codigo" placeholder="Ej: PROD-001 (mínimo 3 caracteres)" minlength="3" required>
                        </div>

                        
                        <div class="grupo-campo">
                            <label for="nombre">Nombre del Producto</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Ingresa el nombre del producto" maxlength="100" required>
                        </div>

                        
                        <div class="grupo-campo">
                            <label for="descripcion">Descripción (opcional)</label>
                            <textarea id="descripcion" name="descripcion" placeholder="Describe brevemente el producto" maxlength="500" rows="3"></textarea>
                        </div>

                        
                        <div class="grupo-campo">
                            <label for="categoria">Categoría</label>
                            <select id="categoria" name="categoria" required>
                                <option value="">-- Seleccione una categoría --</option>
                                <option value="Tecnología">Tecnología</option>
                                <option value="Ropa">Ropa</option>
                                <option value="Accesorios">Accesorios</option>
                                <option value="Hogar">Hogar</option>
                                <option value="Educación">Educación</option>
                            </select>
                        </div>

                        
                        <div class="fila-campos">
                            <div class="grupo-campo campo-mitad">
                                <label for="precio">Precio ($)</label>
                                <input type="number" id="precio" name="precio" placeholder="Cantidad en pesos" min="0" step="1" required>
                            </div>

                            <div class="grupo-campo campo-mitad">
                                <label for="stock">Stock (Cantidad)</label>
                                <input type="number" id="stock" name="stock" placeholder="Cantidad disponible" min="0" step="1" required>
                            </div>
                        </div>

                        
                        <div class="fila-campos">
                            <div class="grupo-campo campo-mitad">
                                <label for="stock-critico">Stock Crítico (opcional)</label>
                                <input type="number" id="stock-critico" name="stock-critico" placeholder="Alerta cuando sea menor o igual" min="0" step="1">
                            </div>

                            <div class="grupo-campo campo-mitad">
                                <label for="imagen">Imagen (opcional)</label>
                                <input type="file" id="imagen" name="imagen" accept="image/*">
                            </div>
                        </div>

                        
                        <div class="contenedor-boton-formulario">
                            <button type="submit" class="boton-formulario">REGISTRAR PRODUCTO</button>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="../javascript/auth.js"></script>
    <script src="../javascript/main.js"></script>
</body>
</html>
